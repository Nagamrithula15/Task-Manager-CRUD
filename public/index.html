<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager CRUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <h1>📋 Task Manager</h1>
      <p class="subtitle">A simple full-stack CRUD application with Node.js, Express & MongoDB</p>
    </header>

    <!-- Notification Alert -->
    <div id="alert-box" class="alert hidden"></div>

    <!-- Main Content Layout -->
    <div class="main-grid">
      <!-- Task Form (Create & Update) -->
      <section class="card form-section">
        <h2 id="form-title">➕ Add New Task</h2>
        <form id="task-form">
          <input type="hidden" id="task-id">
          
          <div class="form-group">
            <label for="task-title">Title <span class="required">*</span></label>
            <input 
              type="text" 
              id="task-title" 
              placeholder="e.g. Complete assignment" 
              required
            >
          </div>

          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea 
              id="task-desc" 
              rows="3" 
              placeholder="Add details about this task..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add Task</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
          </div>
        </form>
      </section>

      <!-- Task List & Filters -->
      <section class="card list-section">
        <div class="list-header">
          <h2>All Tasks (<span id="task-count">0</span>)</h2>
          <div class="filter-group">
            <label for="filter-status">Filter:</label>
            <select id="filter-status">
              <option value="All">All</option>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <!-- Task List Container -->
        <div id="tasks-container" class="tasks-container">
          <p class="loading-text">Loading tasks...</p>
        </div>
      </section>
    </div>
  </div>

  <!-- View Task Modal (View One Task) -->
  <div id="view-modal" class="modal hidden">
    <div class="modal-content card">
      <div class="modal-header">
        <h3 id="modal-title">Task Details</h3>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-row">
          <span class="detail-label">ID:</span>
          <span id="modal-id" class="detail-value mono"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Title:</span>
          <span id="modal-task-title" class="detail-value font-bold"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Description:</span>
          <p id="modal-desc" class="detail-value desc-box"></p>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status:</span>
          <span id="modal-status" class="badge"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Created At:</span>
          <span id="modal-date" class="detail-value"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-edit-btn" class="btn btn-primary">Edit Task</button>
        <button id="modal-close-btn" class="btn btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
